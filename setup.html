<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding for Unicode support -->
    <meta charset="UTF-8">
    
    <!-- Ensures the page renders at the width of the device (Responsive Design) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO and Browser Tab Title -->
    <title>Professional Basic Page</title>
    
    <!-- Meta description for search engines -->
    <meta name="description" content="A clean, accessible HTML5 starter template.">

    <!-- Linking an external CSS stylesheet (Best Practice) -->
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Core Content</h2>
            <p>This is where the main substance of your page lives.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Your Name</p>
    </footer>

    <!-- Scripts are placed at the end for faster page loading -->
    <script src="script.js"></script>
</body>
</html>
